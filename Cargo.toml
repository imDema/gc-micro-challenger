[package]
name = "micro-challenger"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7.5"
axum-server = { version = "0.6.0", features = ["tls-rustls"] }
base64 = "0.22.1"
clap = { version = "4.5.7", features = ["derive"] }
color-eyre = "0.6.3"
crossbeam = "0.8.4"
dashmap = "6.0.1"
eyre = "0.6.12"
flate2 = "1.0.35"
fxhash = "0.2.1"
num_cpus = "1.16.0"
parking_lot = "0.12.3"
plotters = "0.3.7"
rand = { version = "0.8.5", features = ["small_rng"] }
rmp = "0.8.14"
rmp-serde = "1.3.0"
rust-embed = "8.5.0"
serde = { version = "1.0.203", features = ["derive"] }
serde_bytes = "0.11.15"
serde_json = "1.0.118"
sled = { version = "0.34.7", features = ["zstd"] }
tar = "0.4.43"
thiserror = "1.0.61"
time = { version = "0.3.36", features = ["formatting", "serde"] }
tokio = { version = "1.38.0", features = ["full"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
ulid = "1.1.2"

[dev-dependencies]
reqwest = { version = "0.12.9", features = ["json"] }

[profile.release]
lto = true
strip = "debuginfo"
